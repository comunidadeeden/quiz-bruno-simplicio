name: Conferir arquivos RaioX publicados (somente leitura)
on:
  push:
    branches: [verify/raiox-live-a19f92fc]
    paths: ['.github/workflows/raiox-live-read-check.yml']
permissions:
  contents: read
jobs:
  read-public-files:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a19f92fc6becf32fef4a2711b7a53c8402ff1490
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirmar HTTP e SHA256 dos quatro arquivos publicos (sem executar JS)
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const sha='a19f92fc6becf32fef4a2711b7a53c8402ff1490';
          const build='20261009-confirmed-persistence-v3';
          const origin='https://quiz.brunosimplicio.com.br';
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          const report={commit:sha,mode:'HTTP GET only; no script execution, form submission, database access or tracking calls',checked_at:new Date().toISOString(),files:[]};
          for(const page of ['raiox01','raiox02']){
            for(const type of ['html','js']){
              const file=type==='html'?`${page}/index.html`:`${page}/${page}.js`;
              const expected=fs.readFileSync(file);
              const path=type==='html'?`/${page}/`:`/${page}/${page}.js?v=${build}`;
              const url=new URL(path,origin);
              url.searchParams.set('rx_verify',sha);
              let entry;
              for(let attempt=1;attempt<=3;attempt++){
                try{
                  const response=await fetch(url,{method:'GET',redirect:'error',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(10000)});
                  const actual=Buffer.from(await response.arrayBuffer());
                  entry={page,file,status:response.status,attempt,bytes:actual.length,expected_sha256:digest(expected),actual_sha256:digest(actual),server:response.headers.get('server'),cache:response.headers.get('x-vercel-cache'),request_id:response.headers.get('x-vercel-id'),checked_at:new Date().toISOString()};
                  entry.matches=entry.status===200&&entry.actual_sha256===entry.expected_sha256;
                  if(type==='html')entry.app_build_present=actual.toString('utf8').includes(`${page}.js?v=${build}`);
                  if(entry.matches)break;
                }catch(error){entry={page,file,attempt,matches:false,error:String(error.message),checked_at:new Date().toISOString()};}
                if(attempt<3)await new Promise(resolve=>setTimeout(resolve,5000));
              }
              report.files.push(entry);
            }
          }
          report.all_match=report.files.length===4&&report.files.every(x=>x.matches&&x.app_build_present!==false);
          fs.writeFileSync('/tmp/raiox-live-read-check.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          assert(report.all_match,'Production files did not all match the tested main commit');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raiox-live-a19f92fc-readonly-evidence
          path: /tmp/raiox-live-read-check.json
