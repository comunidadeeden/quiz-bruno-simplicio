name: Validar qualidade do checkout
on:
  push:
    branches: [fix/checkout-quality-20261001]
permissions:
  contents: write
jobs:
  validate-quality:
    if: ${{ !contains(github.event.head_commit.message, '[skip quality]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checkout-quality-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar arvore limpa
        run: test -z "$(git status --porcelain)"
      - name: Instalar script sem modificar os rastreadores ou o conteudo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for page in ['pagina01','pagina02','pagina03','pagina04','raiox01','raiox02']:
            path=Path(page)/'index.html'
            text=path.read_text()
            if 'scripts/checkout-quality.js' in text:
              raise RuntimeError('Script ja instalado: '+page)
            if text.count('</body>') != 1:
              raise RuntimeError('Estrutura HTML inesperada: '+page)
            text=text.replace('</body>','<script src="/scripts/checkout-quality.js?v=20261001" defer></script>\n</body>')
            path.write_text(text)
          p=Path('supabase/migrations/20261001150000_quiz_checkout_quality_evidence.sql')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text("set lock_timeout='5s';\nalter table public.sales_page_events drop constraint sales_page_events_page_type_check;\nalter table public.sales_page_events add constraint sales_page_events_page_type_check check (page_type='sales_page' or (page_type='quiz' and page_id in ('raiox01','raiox02') and event_name='cta_click' and properties->'quality_evidence_only'='true'::jsonb));\n")
          Path('CHECKOUT-QUALITY.md').write_text('''# Qualidade dos cliques — 01/10/2026

          As seis paginas carregam um observador adicional. Ele nao altera navegacao, conteudo, GTM ou Pixel e nunca envia checkout_click. Usa a sessao nativa e registra somente evidencia cta_click com quality_evidence_only=true e cta_index=0, fora do engajamento por botao.

          isTrusted, visibilidade e webdriver sao sinais declarados pelo navegador, nao prova de humanidade. O coletor preserva somente booleanos, identifica User-Agent explicitamente automatizado sem salvar UA/IP e nao aceita bot score enviado pelo cliente. Redes, paises e idiomas nunca sao motivo de exclusao.

          Evidencia de quiz exige sessao existente e herda a tag do quiz no banco. Evidencia de pagina herda a tag do page_view original. Idempotencia por event_id e test_mode permanecem. O sincronizador existente repassa as propriedades ao Dash; eventos de teste nao sao sincronizados.

          O Dash separa bruto, suspeito e apos filtro. Sem sinais de interacao, a sessao permanece sem verificacao. Nao confirma carregamento da Hotmart. Vendas sao independentes e nunca removidas por essa classificacao.
          ''')
          PY
      - name: Sintaxe e testes sem requisicoes reais
        run: |
          node --check scripts/checkout-quality.js
          node --check pagina01/tracking.js
          node --check scripts/sales-page-tracking.js
          node --check raiox01/rx-tracking.js
          node --check raiox02/rx-tracking.js
          node --experimental-strip-types --test scripts/checkout-quality.test.mjs
          git diff --exit-code -- pagina01/tracking.js scripts/sales-page-tracking.js raiox01/rx-tracking.js raiox02/rx-tracking.js
          git diff --check
      - name: Salvar alteracoes testadas somente na branch
        run: |
          git add pagina01/index.html pagina02/index.html pagina03/index.html pagina04/index.html raiox01/index.html raiox02/index.html supabase/migrations/20261001150000_quiz_checkout_quality_evidence.sql CHECKOUT-QUALITY.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: observa qualidade do clique nas seis paginas [skip quality]'
          git push origin HEAD:fix/checkout-quality-20261001
          git rev-parse HEAD
